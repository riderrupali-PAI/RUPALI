name: Build RUPALI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "artifacts/rupali/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/rupali

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies with hoisting
        run: pnpm install --no-frozen-lockfile --shamefully-hoist

      - name: Run Expo Prebuild & Build APK
        env:
          NODE_ENV: production
        run: |
          # एक्सपो प्रीबिल्ड चालवणे आणि NODE_ENV पास करणे
          npx expo prebuild --platform android --clean
          
          # ग्रॅडेलद्वारे रिलीज APK बिल्ड करणे
          cd android && ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: artifacts/rupali/android/app/build/outputs/apk/release/*.apk
