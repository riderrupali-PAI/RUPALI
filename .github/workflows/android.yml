name: Build RUPALI Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest
          run_install: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build release APK
        run: |
          # React Native / Expo बिल्ड कमांड
          echo "Building APK..."
          # npx expo run:android --variant release किंवा योग्य बिल्ड कमांड येथे टाका
