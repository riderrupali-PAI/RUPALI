name: Build RUPALI Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest
          run_install: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --shamefully-hoist

      - name: Run Expo Prebuild & Build APK
        run: |
          # मेट्रो बंडलरसाठी योग्य कन्फिगरेशन तयार करणे
          echo "const { getDefaultConfig } = require('expo/metro-config');" > metro.config.js
          echo "const config = getDefaultConfig(__dirname);" >> metro.config.js
          echo "module.exports = config;" >> metro.config.js

          # ऍप्सचे पॅकेज आणि नेटिव्ह फोल्डर प्रीबिल्ड करणे
          npx expo prebuild --platform android --clean

          # Gradle द्वारे APK बिल्ड करणे
          cd android && ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
